# Generated by scripts/build_book.py — edit that, not this.
project:
  type: book
  output-dir: ../docs/book

book:
  title: "Geopolitical Risks and International Business"
  subtitle: "INTE 60019A · HEC Montréal"
  author: "Thierry Warin, PhD"
  date: last-modified
  date-format: "D MMMM YYYY"
  search: true
  repo-url: https://github.com/warint/geopolitics-geoeconomics
  repo-branch: main
  repo-actions: [source, issue]
  downloads: [pdf]
  page-navigation: true
  sidebar:
    style: docked
    collapse-level: 1
  page-footer:
    left: "INTE 60019A · HEC Montréal"
