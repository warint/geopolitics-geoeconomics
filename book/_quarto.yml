    - session-01.qmd
    - session-02.qmd
    - session-03.qmd
    - session-04.qmd
    - session-05.qmd
    - session-06.qmd
    - session-07.qmd
    - session-08.qmd
    - session-09.qmd
    - session-10.qmd
    - session-11.qmd
    - session-12.qmd
  appendices:
    - replications.qmd
    - data-sources.qmd
    - tableau-toolkit.qmd
    - readings.qmd
    - assessment.qmd

format:
  html:
    theme: [cosmo, book.scss]
    toc: true
    toc-depth: 3
    link-external-newwindow: true
  pdf:
    documentclass: scrbook
    classoption: [10pt, twoside, openright, numbers=noenddot, chapterprefix=true]
    pdf-engine: xelatex
    mainfont: "Times New Roman"
    sansfont: "Helvetica Neue"
    monofont: "Menlo"
    monofontoptions: [Scale=0.82]
    colorlinks: true
    toc: true
    toc-depth: 2
    number-sections: true
    geometry: [margin=2.2cm]
